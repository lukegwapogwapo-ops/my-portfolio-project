<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NBA Stats</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h1>🏀 NBA STATS</h1>

            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#teams">Teams</a></li>
            </ul>
        </nav>
    </header>

    <!-- Basketball video at the top -->
    <section class="video-container">
        <iframe
            width="100%"
            height="400"
            src="https://www.youtube.com/embed/QAGoLhkrHf0?autoplay=1&mute=1&playsinline=1"
            title="Kobe Bryant Basketball Highlights"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>
    </section>

    <main>

        <section id="home" class="hero">
            <h2>NBA Teams</h2>

            <p>
                Explore all 30 NBA teams.
            </p>

            <button id="exploreBtn">
                Explore Teams
            </button>
        </section>

        <section id="teams" class="section">

            <h2>All NBA Teams</h2>

            <div class="search-box">

                <input
                    type="text"
                    id="teamSearch"
                    placeholder="Search for a team..."
                >

                <button id="searchBtn">
                    Search
                </button>

            </div>

            <div id="teamResults" class="team-grid">
                <!-- Teams will appear here -->
            </div>

        </section>

    </main>

    <footer>
        <p>NBA Stats Project © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>

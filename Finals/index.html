<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bro, Don't Get Hit!</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>💀 Bro, Don't Get Hit!</h1>
    <p>Use the LEFT and RIGHT arrow keys to dodge the rocks!</p>

    <div id="gameContainer">
    <canvas id="game" width="600" height="400"></canvas>
    <div id="gameVideo"></div>
</div>

    <h2>Time: <span id="timer">20</span> seconds</h2>
    <p id="message">Ready to test your skills, bro?</p>

    <button id="startButton">START / RESTART</button>

    <section id="result" hidden>
        <h2 id="resultTitle"></h2>
        <div id="memeContainer">
    <iframe
        src="https://vlipsy.com/embed/KV2lyAhd"
        width="400"
        height="225"
        allowfullscreen>
    </iframe>
</div>
        <button id="playAgainButton">PLAY AGAIN 🔁</button>
    </section>
</body>
</html>
